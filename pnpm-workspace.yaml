minimumReleaseAgeExclude:
  - unzipper@0.12.5
shellEmulator: true

trustPolicy: no-downgrade

injectWorkspacePackages: true

# electron + electron-builder pull pre-provenance tooling deps that trip
# trustPolicy: no-downgrade. Exempt just those (policy stays enforced elsewhere).
trustPolicyExclude:
  - undici-types
  - semver

packages:
  - packages/*

overrides:
  # Dedupe to one @codemirror/view: two copies make the editor silently drop syntax-highlight decorations.
  '@codemirror/view': ^6.43.8
  # CVE fix (dependabot #4): bump only the vite/vitest esbuild; leave the 0.18.x esbuild-kit tree.
  esbuild@0.28.0: 0.28.1

peerDependencyRules:
  allowedVersions:
    '@vee-validate/zod>zod': '4'

# pnpm 11 replaces onlyBuiltDependencies with this map. winstaller off: desktop ships mac-only.
allowBuilds:
  # @sentry/vite-plugin shells out to sentry-cli to upload source maps; needs its binary downloaded.
  '@sentry/cli': true
  electron: true
  electron-winstaller: false
  esbuild: true
  # Transitive via @unovis (maps); kinora only uses XY charts, so skip its native build.
  maplibre-gl: false
  vue-demi: true
