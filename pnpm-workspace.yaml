# transitive (electron-builder), freshly published; exempt from pnpm 11's default release cooldown.
minimumReleaseAgeExclude:
  - unzipper@0.12.5
shellEmulator: true

trustPolicy: no-downgrade

injectWorkspacePackages: true

# electron + electron-builder pull pre-provenance tooling deps that trip
# trustPolicy: no-downgrade. Exempt just those (policy stays enforced elsewhere).
trustPolicyExclude:
  - undici-types
  - semver

packages:
  - packages/*

# CVE fix (dependabot #4): bump only the vite/vitest esbuild; leave the 0.18.x esbuild-kit tree.
overrides:
  esbuild@0.28.0: 0.28.1

peerDependencyRules:
  allowedVersions:
    '@vee-validate/zod>zod': '4'

# pnpm 11 replaces onlyBuiltDependencies with this map. winstaller off: desktop ships mac-only.
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  vue-demi: true
