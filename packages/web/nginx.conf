server {
  listen 80;
  server_name _;

  # Bare /trace -> /trace/ (the viewer is served with base /trace/).
  location = /trace {
    return 301 /trace/;
  }

  # Embedded trace viewer (built with base /trace/: its own index, assets, sw).
  location /trace/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /trace/index.html;
    # Viewer renders untrusted recorded content in sandboxed iframes + a SW that range-fetches
    # the trace zip from any artifact origin; resource directives stay open, only harden the rest.
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
  }

  # Web hashed assets - immutable, long cache.
  location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Web SPA - vue-router history fallback.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    # img https: = social-login avatars; connect https: = cross-origin API + Sentry; style inline = Vue/Tailwind.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  }
}
