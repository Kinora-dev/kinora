appId: dev.kinora.desktop
productName: kinora
directories:
  output: release
  buildResources: build

# Compiled main/preload + the package manifest. The renderer (trace viewer) is
# shipped as a resource, not packed into the asar.
files:
  - dist/**
  - package.json

# Static renderers served by the loopback server at runtime (resolve*Dir() ->
# resourcesPath/<name> when packaged): the trace viewer and the home UI.
extraResources:
  - from: ../trace-viewer/dist
    to: viewer
  - from: home/dist
    to: home

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Signing in CI via CSC_LINK / CSC_KEY_PASSWORD; notarize via
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (see desktop-release workflow).
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist

win:
  target:
    - nsis

linux:
  target:
    - AppImage

publish:
  provider: github
  owner: Kinora-dev
  repo: kinora
