name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - .gitignore
  pull_request:
    paths-ignore:
      - 'docs/**'
      - .gitignore

permissions:
  contents: read

# satisfy validate-env on the web build.
env:
  VITE_KINORA_SERVER_URL: http://localhost:3000

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  integration_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: kinora
          POSTGRES_PASSWORD: kinora
          POSTGRES_DB: kinora
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U kinora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # test-env falls back to the dev-compose defaults (kinora @ localhost:5436), which match the service.
      - name: Integration tests
        run: pnpm --filter @kinora/server test:integration

  e2e_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: kinora
          POSTGRES_PASSWORD: kinora
          POSTGRES_DB: kinora
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U kinora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VITE_KINORA_SERVER_URL: http://localhost:3399
      NODE_ENV: development
      PORT: '3399'
      BASE_URL: http://localhost:3399
      WEB_ORIGIN: http://localhost:5399
      AUTH_SECRET: ci-e2e-secret-not-used-for-anything-real
      POSTGRES_USER: kinora
      POSTGRES_PASSWORD: kinora
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5436'
      POSTGRES_DB: kinora_e2e
      STORAGE_DIR: .data/artifacts
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
      KINORA_CLOUD: 'false'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @kinora/web exec playwright install --with-deps chromium

      # test:e2e resets kinora_e2e + self-boots the stack on dedicated ports (same as local).
      - name: E2E (viewer + web suites)
        run: pnpm test:e2e
