name: Desktop Release

# Manual: bump packages/desktop/package.json version, then run this workflow.
# electron-builder publishes a draft GitHub Release review it and publish.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build trace viewer + desktop
        run: |
          pnpm --filter @kinora/trace-viewer build
          pnpm --filter @kinora/desktop build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
          # Bundled trace viewer reports to the desktop project (public DSN, same as config.ts).
          VITE_KINORA_SENTRY_DSN: https://c310f2e5a017909d63b1977ea90149a9@o1155685.ingest.us.sentry.io/4511622840451072

      # Pre-create the draft so electron-builder's concurrent uploads all find it,
      # instead of racing to create it
      - name: Ensure draft release exists
        working-directory: packages/desktop
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --title "v$VERSION" --notes "kinora desktop v$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package, sign, notarize, publish
        working-directory: packages/desktop
        run: pnpm exec electron-builder --mac --publish always
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
