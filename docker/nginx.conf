server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: client-side routes (e.g. /projects/web-app/runs/...) fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Runtime config is rewritten per container start - never cache it
  location = /config.js {
    add_header Cache-Control "no-store";
  }
}
