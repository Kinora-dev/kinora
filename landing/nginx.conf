# Both hostnames route to this service, so www would otherwise serve a second
# copy of every page. Absolute on purpose: this one crosses hosts, TLS is upstream.
server {
  listen 80;
  server_name www.kinora.dev;
  return 301 https://kinora.dev$request_uri;
}

server {
  # Explicitly the default: `_` is an unmatchable name, not a wildcard, so with a
  # second block present everything else would fall to whichever came first.
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets are immutable.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # TLS terminates upstream, so an absolute Location would downgrade to http.
  absolute_redirect off;

  # Canonical URLs have no trailing slash; redirect so both forms don't serve 200.
  location ~ ^(?<no_slash>.+)/$ {
    return 301 $no_slash$is_args$args;
  }

  error_page 404 /404.html;

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }
}
